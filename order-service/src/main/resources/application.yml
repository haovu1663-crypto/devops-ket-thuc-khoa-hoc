server:
  port: 8083

spring:
  application:
    name: order-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3000ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

# ===== gRPC Client: kết nối tới product-service =====
grpc:
  client:
    product-service:
      # Docker internal DNS: tên service trong docker-compose
      address: 'static://${PRODUCT_SERVICE_GRPC_HOST:localhost}:${PRODUCT_SERVICE_GRPC_PORT:9090}'
      negotiation-type: plaintext   # Không TLS trong mạng nội bộ Docker

logging:
  level:
    root: INFO
    com.ecommerce.order: DEBUG
