server:
  port: 8084

spring:
  application:
    name: payment-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3000ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

# ===== Cấu hình Cổng thanh toán VNPAY Sandbox =====
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:2QXUI4J4}
  hash-secret: ${VNPAY_HASH_SECRET:RAOCTXGU2X5TQETQYMWKNZ3Z4126S7N4}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
  version: "2.1.0"
  command: "pay"
  order-type: "other"

# ===== URL Order Service để cập nhật đơn hàng =====
services:
  order-service:
    url: ${ORDER_SERVICE_URL:http://order-service:8083}

logging:
  level:
    root: INFO
    com.ecommerce.payment: DEBUG
