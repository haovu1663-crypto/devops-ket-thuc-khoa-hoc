server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Retry tối đa 3 lần (cách nhau 2s), sau đó đẩy vào Dead Letter Queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}

notification:
  mail-from: ${MAIL_FROM:no-reply@ecommerce.local}
  # Địa chỉ nhận email thực tế khi test/demo (nếu đặt thì mọi email sẽ gửi về đây)
  override-recipient: ${MAIL_OVERRIDE_TO:}
  # Domain dùng khi userId không phải là email
  default-email-domain: ${DEFAULT_EMAIL_DOMAIN:ecommerce.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.ecommerce.notification: DEBUG
