syntax = "proto3";

package com.ecommerce.grpc;

option java_multiple_files = true;
option java_package = "com.ecommerce.grpc";
option java_outer_classname = "ProductServiceProto";

// =====================================================
// Request: chỉ cần product_id để tra cứu
// =====================================================
message GetProductRequest {
  int64 product_id = 1;
}

// =====================================================
// Response: các field cần thiết để snapshot vào order
// =====================================================
message ProductGrpcResponse {
  int64  id       = 1;
  string name     = 2;
  double price    = 3;
  int32  stock    = 4;
  string category = 5;
}

// =====================================================
// gRPC Service Definition
// =====================================================
service ProductGrpcService {
  // Order-service gọi để lấy thông tin sản phẩm
  rpc GetProductById(GetProductRequest) returns (ProductGrpcResponse);
}
